upstream fuelectric_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 13.206.110.29 _;
    client_max_body_size 40m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    location /static/product-images/ {
        alias /opt/mobile/mobile-web-application/server/data/generated/product-images/;
        expires 7d;
        access_log off;
    }

    location /static/app-updates/ {
        alias /opt/mobile/mobile-web-application/server/data/generated/app-updates/;
    }

    location / {
        proxy_pass http://fuelectric_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
}
